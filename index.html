<!doctype html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07070A"><meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">

<title>NIYOZ OS</title>
<style>
:root{
  --bg:#07070A;--s1:#101015;--s2:#17171E;--line:#27272F;--tx:#F4F1E8;--mut:#9C998E;
  --gold:#D4AF37;--gold2:#F0D27A;--ginK:#1A1405;--neon:#37F2C5;--ok:#3DDC84;--bad:#FF5C5C;--warn:#F5B942;--blue:#7AA2FF;--vio:#B48CFF;
  color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
#main{max-width:620px;margin:0 auto;padding:14px 16px 120px}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
.top h1{font-size:28px;font-weight:800;letter-spacing:.01em;margin:0;line-height:1.1}
.top h1::after{content:"";display:block;width:34px;height:3px;background:var(--gold);border-radius:2px;margin-top:6px}
.iconbtn{width:44px;height:44px;border:0;background:none;color:var(--tx);display:grid;place-items:center;border-radius:12px}
.iconbtn:active{background:var(--s2)}
h2.sh{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:700;margin:26px 0 8px}
.note{color:var(--mut);font-size:13px;margin:8px 0 0}
.err{color:var(--bad);font-size:14px;min-height:1.2em;margin:4px 0 0}
.warnbar{background:#2a1410;border:1px solid #6b2a20;color:#ffb4a8;padding:10px 12px;border-radius:12px;font-size:14px;margin-bottom:12px}
.bad{color:var(--bad)}.okc{color:var(--ok)}.gold{color:var(--gold)}.mut{color:var(--mut)}

.btn{background:var(--gold);color:var(--ginK);border:0;border-radius:12px;padding:0 18px;min-height:46px;font-weight:700}
.btn.ghost{background:transparent;color:var(--tx);border:1.5px solid var(--line)}
.btn.dng{background:var(--bad);color:#1b0505}
.btn.ghost.danger{color:var(--bad)}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px}
.btn.wide{width:100%}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-size:14px;white-space:nowrap}
.chip.on{background:var(--gold);color:var(--ginK);border-color:var(--gold);font-weight:700}
.pn{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.pn h3{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pn h3 button{background:none;border:0;color:var(--gold);font-size:13px;font-weight:600;padding:4px 0}
.empty{padding:22px 4px;color:var(--mut)}
.empty b{display:block;color:var(--tx);font-size:17px;margin-bottom:4px}

.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.rmain{flex:1;min-width:0;background:none;border:0;text-align:left;padding:0}
.rt{display:block;font-weight:600;overflow-wrap:anywhere}
.rm{display:block;font-size:13px;color:var(--mut)}
.row.done .rt{text-decoration:line-through;color:var(--mut)}
.chk{width:28px;height:28px;border-radius:9px;border:2px solid #3a3a45;background:transparent;flex:none;position:relative;padding:0}
.chk.on{background:var(--gold);border-color:var(--gold)}
.chk.on::after{content:"";position:absolute;left:8px;top:2px;width:7px;height:14px;border:solid var(--ginK);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.pdot{width:9px;height:9px;border-radius:50%;flex:none}
.amt{font-weight:700;white-space:nowrap}
.amt.in{color:var(--ok)}.amt.out{color:var(--bad)}.amt.sv{color:var(--gold)}

.bar{height:10px;background:#1d1d25;border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;width:var(--w);background:var(--c);border-radius:6px;transition:width .4s}
.big{font-size:40px;font-weight:800;letter-spacing:-.02em;line-height:1.05;overflow-wrap:anywhere}
.big small{font-size:16px;color:var(--mut);font-weight:600;letter-spacing:0}
.neon{color:var(--neon);filter:drop-shadow(0 0 6px rgba(55,242,197,.55))}
.stats{margin-top:6px}
.stat{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.stat span:last-child{font-weight:700;text-align:right}
.sum{list-style:none;margin:0;padding:0}
.sum li{padding:8px 0;border-bottom:1px solid var(--line)}

.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(10,10,14,.97);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.tab{flex:1;min-width:0;border:0;background:none;color:var(--mut);font-size:11.5px;padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab.on{color:var(--gold)}
.tab .em{font-size:22px;line-height:24px}

.mback{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#0E0E13;border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;width:100%;max-width:620px;max-height:92vh;overflow-y:auto;padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.sh-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sh-head h3{margin:0;font-size:19px}
.x{background:none;border:0;color:var(--mut);padding:8px;display:grid;place-items:center}
.ctext{color:var(--tx);line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.secbtn{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px}
.secbtn.off{opacity:.45}
.secbtn.on{border-color:var(--gold);color:var(--gold)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

.fg{margin-bottom:14px}
.fl{display:block;font-size:14px;color:var(--mut);margin-bottom:5px}
input[type=text],input[type=date],input[type=time],input[type=password],input[type=number],select,textarea,.inp{width:100%;background:#0A0A0E;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--tx)}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:none}
textarea{resize:vertical;line-height:1.5}
.chkl{display:flex;align-items:center;gap:10px;margin:6px 0 14px}
.chkl input{width:22px;height:22px;accent-color:var(--gold)}
.rate,.days{display:flex;gap:8px;flex-wrap:wrap}
.rate label,.days label{position:relative}
.rate input,.days input{position:absolute;opacity:0;inset:0}
.rate span,.days span{display:block;min-width:44px;text-align:center;padding:9px 12px;border:1.5px solid var(--line);border-radius:12px;font-weight:600}
.rate input:checked+span,.days input:checked+span{background:var(--gold);color:var(--ginK);border-color:var(--gold)}
.rate input:focus-visible+span,.days input:focus-visible+span{outline:2px solid var(--gold);outline-offset:2px}

.cal{margin:14px 0 4px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.ctitle{font-weight:800;font-size:19px}
.cnav{width:44px;height:44px;border:0;background:none;color:var(--tx);display:grid;place-items:center;border-radius:12px}
.cnav.fwd .ic{transform:rotate(180deg)}
.cnav:disabled{opacity:.25}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cwd{text-align:center;font-size:12px;color:var(--mut);padding:4px 0}
.cd{min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border:1.5px solid transparent;border-radius:11px;background:transparent;font-size:15px;padding:3px 0}
.cd:disabled{opacity:.3}
.cd.sel{border-color:var(--gold)}
.cd.today .dn{color:var(--gold);font-weight:800}
.cd.m-ok{background:rgba(61,220,132,.12)}
.cd.m-bad{background:rgba(255,92,92,.10)}
.mk{width:16px;height:16px;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.mk.ok{stroke:var(--ok)}.mk.bad{stroke:var(--bad)}.mk.gray{stroke:#7b7b86;stroke-width:2.2}
.mk0{height:16px}
.dots{display:flex;gap:3px;height:5px}
.dots i{width:5px;height:5px;border-radius:50%;display:block}
.d-neon{background:var(--neon)}.d-gold{background:var(--gold)}.d-blue{background:var(--blue)}.d-vio{background:var(--vio)}

.chart{width:100%;height:auto;margin:6px 0}
.chart .cl{fill:none;stroke:var(--gold);stroke-width:2.2;stroke-linejoin:round}
.chart .cd{fill:var(--bg);stroke:var(--gold);stroke-width:2}
.chart .ct{fill:var(--mut);font-size:9px}

.dotsrow{display:flex;justify-content:space-between;gap:4px;margin-top:10px}
.dcol{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;font-size:12px;color:var(--mut)}
.dcol.t{color:var(--tx);font-weight:700}
.hd{width:38px;height:38px;border-radius:50%;border:2px solid #3a3a45;background:transparent;position:relative;padding:0}
.hd.off{border-style:dashed;opacity:.5}
.hd.on{background:var(--gold);border-color:var(--gold)}
.hd.on::after{content:"";position:absolute;left:12px;top:6px;width:9px;height:16px;border:solid var(--ginK);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}

.jtitle{width:100%;background:none;border:0;border-bottom:1.5px solid var(--line);font-size:26px;font-weight:800;padding:8px 0 10px;color:var(--tx);border-radius:0}
.jtitle:focus{outline:none;border-color:var(--gold)}
.jbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tools{display:flex;gap:6px;margin:12px 0 8px;flex-wrap:wrap}
.tools button{min-width:44px;height:38px;border:1.5px solid var(--line);background:transparent;border-radius:10px;font-weight:700}
.jbody{width:100%;min-height:46vh;background:#0A0A0E;border:1.5px solid var(--line);border-radius:12px;padding:14px;line-height:1.65;resize:vertical}
.md{border:1.5px solid var(--line);border-radius:12px;padding:6px 16px;min-height:30vh}
.md h2,.md h3{margin:.9em 0 .3em}.md a{color:var(--gold)}.md p{margin:.6em 0}
.save-ok{color:var(--ok)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:#F4F1E8;color:#0b0b0e;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:92%;display:flex;gap:12px;align-items:center}
.toast.show{opacity:1;pointer-events:auto}
.toast button{background:none;border:0;color:#7a5d00;font-weight:800;padding:2px 4px}

.lockov{position:fixed;inset:0;background:var(--bg);z-index:80;display:grid;place-items:center;padding:20px}
.lockbox{width:100%;max-width:340px;text-align:center}
.lockbox .logo{width:72px;height:72px}
.lockbox h2{margin:12px 0 16px}
.pin{text-align:center;letter-spacing:.5em;font-size:24px}

.logo{width:96px;height:96px}
.logo .lp{fill:var(--gold)}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.bar>i{transition:none}}

.days span{min-width:0}
.bars{width:100%;height:auto;margin:6px 0}
.bars rect{fill:var(--gold)}.bars rect.lo{fill:#6b5a1f}.bars text{fill:var(--mut);font-size:8px}
.pill{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 9px;color:var(--mut);margin-right:4px}
.pill.g{color:var(--gold);border-color:#5a4a14}
.bar.sm{height:7px}
.tbl{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}.tbl th{color:var(--mut);font-weight:600;text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}.tbl td{padding:8px 4px;border-bottom:1px solid var(--line)}

</style></head>
<body>
<main id="main"></main>
<nav id="nav" class="tabs" aria-label="Asosiy navigatsiya"></nav>
<div id="lock" class="lockov" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript>NIYOZ OS ishlashi uchun JavaScript yoqilgan bo'lishi kerak.</noscript>
<script>
"use strict";
/* NIYOZ OS 0.1 — core */
const VER="0.2.3";
const MONTHS=["yanvar","fevral","mart","aprel","may","iyun","iyul","avgust","sentabr","oktabr","noyabr","dekabr"];
const WDS=["Du","Se","Ch","Pa","Ju","Sh","Ya"];
const DAYN=["Yakshanba","Dushanba","Seshanba","Chorshanba","Payshanba","Juma","Shanba"];
const $=(s,e)=>(e||document).querySelector(s);
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const dkey=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const pk=k=>{const p=k.split("-").map(Number);return new Date(p[0],p[1]-1,p[2]);};
const today=()=>dkey(new Date());
const addDays=(k,n)=>{const d=pk(k);d.setDate(d.getDate()+n);return dkey(d);};
const fmtD=k=>{const d=pk(k);return d.getDate()+"-"+MONTHS[d.getMonth()];};
const dLabel=k=>k===today()?"Bugun":k===addDays(today(),1)?"Ertaga":k===addDays(today(),-1)?"Kecha":fmtD(k);
const hhmm=()=>{const d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes());};
const uid=()=>(globalThis.crypto&&crypto.randomUUID)?crypto.randomUUID():"id"+Date.now().toString(36)+Math.random().toString(36).slice(2,10);
const money=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,"\u00A0");
const num=s=>{if(s==null)return null;s=String(s).replace(/\s/g,"").replace(",",".");if(s==="")return null;const v=Number(s);return isFinite(v)?v:null;};
const fmtN=n=>String(Math.round(n*100)/100).replace(".",",");
const sgn=n=>(n>0?"+":n<0?"−":"")+fmtN(Math.abs(n));
const weekStart=k=>addDays(k,-((pk(k).getDay()+6)%7));
const monthStart=k=>k.slice(0,8)+"01";
const monthEnd=k=>{const d=pk(k);return dkey(new Date(d.getFullYear(),d.getMonth()+1,0));};

const LOGO='<svg viewBox="0 0 100 100" class="logo" aria-hidden="true"><path class="lp" d="M22 80V20h12l32 42V20h12v60H66L34 38v42z"/></svg>';
const IC={
home:'<path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>',
check:'<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.5 12.5l2.5 2.5 4.5-5.5"/>',
cal:'<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/>',
coin:'<path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H18v3"/><path d="M4 7.5V17a2 2 0 0 0 2 2h12a1 1 0 0 0 1-1V9a1 1 0 0 0-1-1H6.5A2.5 2.5 0 0 1 4 7.5z"/><circle cx="15.5" cy="13.5" r="1"/>',
spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M18 16l.8 2.2L21 19l-2.2.8L18 22l-.8-2.2L15 19l2.2-.8z"/>',
loop:'<path d="M20 12a8 8 0 1 1-2.5-5.8"/><path d="M20 4v5h-5"/>',
dumb:'<path d="M6.5 7v10M17.5 7v10M3.5 10v4M20.5 10v4M6.5 12h11"/>',
moon:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
book:'<path d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h10"/>',
gear:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>',
target:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/>',
leaf:'<path d="M5 19c0-8 5-14 14-14 0 9-6 14-14 14z"/><path d="M5 19c3-4 6-6 9-8"/>',
folder:'<path d="M3.5 7a2 2 0 0 1 2-2H10l2 2.5h6.5a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/>',
db:'<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/>',
chart:'<path d="M4 20V4M4 20h16M8 16v-4M12 16V8M16 16v-6"/>',
plus:'<path d="M12 5v14M5 12h14"/>',
search:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>',
more:'<path d="M6 6l6 6-6 6M13 6l6 6-6 6"/>',
back:'<path d="M15 5l-7 7 7 7"/>',
trash:'<path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13M10 11v6M14 11v6"/>',
lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
x:'<path d="M6 6l12 12M18 6L6 18"/>',
up:'<path d="M6 14l6-6 6 6"/>',
down:'<path d="M6 10l6 6 6-6"/>',
copy:'<rect x="8" y="8" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>'
};
const ico=n=>'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">'+(IC[n]||"")+"</svg>";
const MARK={
ok:'<svg class="mk ok" viewBox="0 0 20 20" aria-hidden="true"><path d="M4.5 10.5l3.8 3.8 7.2-8.3"/></svg>',
gray:'<svg class="mk gray" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="5.5" fill="none"/></svg>',
bad:'<svg class="mk bad" viewBox="0 0 20 20" aria-hidden="true"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9"/></svg>'
};

/* ---------- Mahalliy ma'lumotlar bazasi (IndexedDB, zaxira: localStorage) ---------- */
const DB={cache:new Map(),idb:null,mode:"idb",
 async init(){
  try{
   this.idb=await new Promise((res,rej)=>{const q=indexedDB.open("niyozos",1);q.onupgradeneeded=()=>q.result.createObjectStore("r",{keyPath:"id"});q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);q.onblocked=()=>rej(new Error("blocked"));});
   const all=await new Promise((res,rej)=>{const q=this.idb.transaction("r").objectStore("r").getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});
   all.forEach(r=>this.cache.set(r.id,r));
  }catch(e){
   this.mode="ls";this.idb=null;
   try{const raw=localStorage.getItem("niyozos_ls");if(raw)JSON.parse(raw).forEach(r=>this.cache.set(r.id,r));localStorage.setItem("niyozos_probe","1");}catch(_){this.mode="mem";}
  }
 },
 _save(recs,del){
  if(this.mode==="idb")return new Promise((res,rej)=>{const tx=this.idb.transaction("r","readwrite"),s=tx.objectStore("r");recs.forEach(r=>s.put(r));(del||[]).forEach(i=>s.delete(i));tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error);});
  if(this.mode==="ls"){try{localStorage.setItem("niyozos_ls",JSON.stringify([...this.cache.values()]));return Promise.resolve();}catch(e){return Promise.reject(e);}}
  return Promise.resolve();
 },
 put(r){const now=Date.now();if(!r.id)r.id=uid();if(!r.c)r.c=now;r.u=now;r.v=(r.v||0)+1;if(r.d===undefined)r.d=null;this.cache.set(r.id,r);this._save([r]).catch(()=>toast("Saqlab bo'lmadi! Telefon xotirasini tekshiring"));return r;},

 },

const UNL=new Set();let lockFails=0,lockUntil=0,hiddenAt=0;
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));

async function hashPin(pin,saltB64){
 const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pin),"PBKDF2",false,["deriveBits"]);
 return b64(await crypto.subtle.deriveBits({name:"PBKDF2",salt:unb64(saltB64),iterations:150000,hash:"SHA-256"},k,256));
}

/* ---------- Android Back / brauzer Back: ilovaning ichki navigatsiyasi bilan bir butun ----------
   Usul: brauzer tarixida doim bitta «qo'riqchi» yozuv turadi. Back bosilganda brauzer shu yozuvdan qaytadi
   va popstate ishga tushadi. Ilova o'zi hal qiladi (oyna yopish, ichki sahifaga qaytish yoki chiqish
   ogohlantirishi), keyin qo'riqchi yozuvni qayta qo'yadi. Ichki tarix (NAV.stack) ilovaning o'zida saqlanadi. */
const NAV={stack:[],cur:null,curSnap:null,restoring:false,armed:false,exitUntil:0,exitTimer:null};
/* qaysi bo'limda qaysi ichki holat «sahifa» hisoblanadi (filtr va qidiruv emas, faqat joy) */
const SECKEYS={finance:["fin",["tab","sav"]],fitness:["fit",["tab"]],nutrition:["nut",["tab"]],project:["proj",["id"]],journal:["j",["nb","pg"]],settings:["set",["sub"]]};
function navSnap(){
 const p={},d=SECKEYS[ST.sec];
 if(d&&ST.v[d[0]])d[1].forEach(f=>{const v=ST.v[d[0]][f];p[f]=v===undefined?null:v;});
 return {sec:ST.sec,p};
}
/* render() oxirida chaqiriladi: joy o'zgargan bo'lsa, oldingi joyni tarixga qo'shadi.
   Agar yangi joy tarixdagi oxirgi joy bilan bir xil bo'lsa (ilovadagi «orqaga» tugmasi), tarixdan olib tashlaydi. */
function trackNav(){
 const snap=navSnap(),key=JSON.stringify(snap);
 if(NAV.cur===null){NAV.cur=key;NAV.curSnap=snap;return;}
 if(key===NAV.cur)return;
 if(!NAV.restoring){
  const top=NAV.stack[NAV.stack.length-1];
  if(top&&JSON.stringify(top)===key)NAV.stack.pop();
  else{NAV.stack.push(NAV.curSnap);if(NAV.stack.length>50)NAV.stack.shift();}
 }
 NAV.cur=key;NAV.curSnap=snap;
}
/* o'chirilgan yoki qulflangan joyga qaytmaslik uchun */
function navValid(snap){
 const alive=id=>{if(!id)return true;const r=DB.get(id);return !!r&&!r.d;},p=snap.p||{};
 if(!secs().some(x=>x.id===snap.sec))return false;
 if(snap.sec.indexOf("m:")===0&&!alive(snap.sec.slice(2)))return false;
 if((snap.sec==="finance"||snap.sec==="journal")&&needsLock(snap.sec))return false;

const KINDS={income:"Daromad",expense:"Xarajat",save:"Jamg'armaga qo'shish",withdraw:"Jamg'armadan yechish"};
const txns=()=>DB.list("txn"),savs=()=>DB.list("sav");
const nzs=v=>(typeof v==="number"&&isFinite(v))?v:0;
/* Joriy qoldiq = boshlang'ich qoldiq + barcha kiritilgan − barcha yechilgan (savatdagi operatsiyalar hisobga olinmaydi) */
function savBal(id,ex){const s=DB.get(id);let b=s?nzs(s.init):0;for(const x of txns()){if(x.sav!==id||x.id===ex)continue;if(x.kind==="save")b+=x.amount;else if(x.kind==="withdraw")b-=x.amount;}return b;}
function savStat(id){const s=DB.get(id),init=s?nzs(s.init):0;let dep=0,wd=0;for(const x of txns()){if(x.sav!==id)continue;if(x.kind==="save")dep+=x.amount;else if(x.kind==="withdraw")wd+=x.amount;}return {init,dep,wd,bal:init+dep-wd};}
const daysBetween=(a,b)=>Math.round((pk(b)-pk(a))/864e5);
/* Maqsad hisoblagichi: yetishmayotgan = max(0, maqsad − qoldiq); kunlik = yetishmayotgan / qolgan kunlar (yuqoriga yaxlitlanadi) */
function savCalc(s,tk){
 tk=tk||today();const st=savStat(s.id),target=s.target>0?s.target:null,tdate=s.tdate||null;
 const r={init:st.init,dep:st.dep,wd:st.wd,bal:st.bal,target,tdate,missing:null,pct:null,done:false,overdue:false,daysLeft:null,overdueDays:null,perDay:null,perMonth:null,monthsLeft:null};
 if(!target)return r;
 r.missing=Math.max(0,target-st.bal);r.done=st.bal>=target;
 r.pct=r.done?100:Math.min(99,Math.max(0,Math.floor(st.bal/target*100)));
 if(!tdate)return r;
 const diff=daysBetween(tk,tdate);
 if(r.done){r.perDay=0;r.perMonth=0;r.daysLeft=Math.max(0,diff);return r;}
 if(diff<0){r.overdue=true;r.overdueDays=-diff;return r;}
 r.daysLeft=diff;r.monthsLeft=diff/30.4375;
 r.perDay=Math.ceil(r.missing/Math.max(1,diff));
 r.perMonth=r.monthsLeft<=1?r.missing:Math.ceil(r.missing/r.monthsLeft);
 return r;
}
/* Ma'lumotlar bazasi migratsiyasi: eski jamg'armalarga boshlang'ich qoldiq (0) va maqsad sanasi maydoni qo'shiladi. Operatsiyalar o'zgarmaydi. */
const SCHEMA=2;
function migrate(){
 const c=CFG();if((c.schema||1)>=SCHEMA)return 0;let n=0;
 for(const s of DB.list("sav").concat(DB.list("sav",true))){let ch=false;if(s.init===undefined){s.init=0;ch=true;}if(s.tdate===undefined){s.tdate=null;ch=true;}if(ch){DB.put(s);n++;}}
 c.schema=SCHEMA;DB.put(c);return n;
}

const gymOn=k=>{const r=DB.get("gym:"+k);return !!(r&&r.on);};
function setGym(k,on){const r=DB.get("gym:"+k)||{id:"gym:"+k,t:"gym",date:k};r.on=on;DB.put(r);}
const gymDays=()=>DB.list("gym").filter(r=>r.on).map(r=>r.date);
const byDate=(a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.c||0)-(b.c||0);
function parseEx(raw){
 const lines=[];
 for(const ln of String(raw||"").split("\n")){
  const s=ln.trim();if(!s)continue;
  const i=s.indexOf(":"),name=(i>=0?s.slice(0,i):s).trim(),rest=i>=0?s.slice(i+1):"",sets=[],re=/(\d+(?:[.,]\d+)?)\s*[x×*]\s*(\d+)/gi;let m;
  while((m=re.exec(rest)))sets.push({w:parseFloat(m[1].replace(",",".")),r:parseInt(m[2],10)});
  if(name)lines.push({name,sets});
 }
 return lines;
}
const woVol=w=>(w.lines||[]).reduce((a,l)=>a+l.sets.reduce((b,s)=>b+s.w*s.r,0),0);
function exLib(){const m=new Map();for(const w of DB.list("wo").sort(byDate))for(const l of w.lines||[]){const k=l.name.toLowerCase();if(!m.has(k))m.set(k,l.name);}return [...m.values()];}
function exHist(name){
 const k=name.toLowerCase(),out=[];
 for(const w of DB.list("wo").sort(byDate))for(const l of w.lines||[]){
  if(l.name.toLowerCase()!==k||!l.sets.length)continue;
  const b=l.sets.reduce((a,s)=>(s.w>a.w||(s.w===a.w&&s.r>a.r))?s:a,l.sets[0]);
  out.push({date:w.date,w:b.w,r:b.r});
 }
 return out;
}

const toMin=t=>{const p=t.split(":");return (+p[0])*60+(+p[1]);};
const sleepDur=e=>{let d=toMin(e.wake)-toMin(e.bed);if(d<=0)d+=1440;return d;};
const fmtDur=m=>Math.floor(m/60)+" soat"+(m%60?" "+(m%60)+" daqiqa":"");
function sleepStatus(e){const h=sleepDur(e)/60,r=CFG().sleep;return h<r.min?"low":h>r.max?"high":"ok";}
const sleepRec=k=>{const r=DB.get("sleep:"+k);return r&&!r.d?r:null;};

 if(S.edit)h+='<div class="grid2"><div class="fg"><label class="fl">Kamida (soat)</label><input class="inp" type="text" inputmode="decimal" value="'+r.min+'" data-chg="slmin"></div><div class="fg"><label class="fl">Ko\'pi bilan (soat)</label><input class="inp" type="text" inputmode="decimal" value="'+r.max+'" data-chg="slmax"></div></div>';
 h+='<h2 class="sh">Uyg\'ongan kun: '+dLabel(sel)+'</h2><form data-form="sleep"><div class="grid2"><div class="fg"><label class="fl" for="s-bed">Uxlagan vaqt</label><input class="inp" id="s-bed" name="bed" type="time" value="'+(e?esc(e.bed):"")+'"></div><div class="fg"><label class="fl" for="s-wake">Uyg\'ongan vaqt</label><input class="inp" id="s-wake" name="wake" type="time" value="'+(e?esc(e.wake):"")+'"></div></div>'+
  '<div class="fg"><span class="fl">Uyqu sifatiga o\'z bahongiz (1-5)</span><div class="rate">'+[1,2,3,4,5].map(n=>'<label><input type="radio" name="q" value="'+n+'"'+(e&&e.q===n?" checked":"")+"><span>"+n+"</span></label>").join("")+'</div></div><div class="fg"><label class="fl" for="s-mood">Uyg\'ongandagi holat</label><select id="s-mood" name="mood">'+["","Tetik","O'rtacha","Charchagan"].map(m=>'<option value="'+m+'"'+(e&&e.mood===m?" selected":"")+">"+(m||"Tanlanmagan")+"</option>").join("")+'</select></div><div class="fg"><label class="fl" for="s-note">Izoh</label><input class="inp" id="s-note" name="note" type="text" value="'+(e?esc(e.note||""):"")+'"></div><p class="err" role="alert"></p><div class="btns" style="margin-top:0"><button class="btn" type="submit">Saqlash</button>'+(e?'<button class="btn ghost danger" type="button" data-act="sldel">Savatga</button>':"")+"</div></form>";
 if(e){const st=sleepStatus(e);h+='<p style="font-weight:700;margin:12px 0 0" class="'+(st==="ok"?"okc":"mut")+'">'+fmtDur(sleepDur(e))+" uxlagansiz. "+(st==="ok"?"Bu normal uyqu.":st==="low"?"Bu normaldan kam.":"Bu normaldan ko'p.")+"</p>";}
 h+=calHTML("sleep",k=>{const x=sleepRec(k);return x?{m:sleepStatus(x)==="ok"?"ok":null,dots:sleepStatus(x)==="ok"?[]:["blue"]}:null;},{noFuture:true});
 h+='<p class="note">Yashil ✓: uyqu davomiyligi normal oraliqda. Ko\'k nuqta: uyqu yozilgan, lekin oraliqdan tashqarida. Sifat bahosi davomiylikdan alohida, o\'zingiz qo\'yasiz.</p>';
 let sum=0,cnt=0,qs=0,qc=0;
 for(let i=0;i<7;i++){const x=sleepRec(addDays(today(),-i));if(x){sum+=sleepDur(x);cnt++;if(x.q){qs+=x.q;qc++;}}}
 const normal=DB.list("sleep").filter(x=>x.date.indexOf(pre)===0&&sleepStatus(x)==="ok").length;
 h+='<div class="stats"><div class="stat"><span>Oxirgi 7 kun o\'rtacha davomiylik</span><span>'+(cnt?fmtDur(Math.round(sum/cnt)):"ma'lumot yo'q")+'</span></div><div class="stat"><span>Oxirgi 7 kun o\'rtacha baho</span><span>'+(qc?fmtN(qs/qc)+" / 5":"ma'lumot yo'q")+'</span></div><div class="stat"><span>'+cap(MONTHS[c.m])+" oyida normal kunlar</span><span>"+normal+" kun</span></div></div>";
 return h;
};

/* ---------- Journal ---------- */
function md(src){
 const inline=s=>s.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\*([^*]+)\*/g,"<i>$1</i>")
  .replace(/\[\[([^\]]+)\]\]/g,(m,t)=>'<a href="#" data-act="jlink" data-t="'+t+'">'+t+"</a>")
  .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+|mailto:[^)\s]+)\)/g,(m,t,u)=>'<a href="'+u+'" target="_blank" rel="noopener">'+t+"</a>");
 let out="",list=null;const close=()=>{if(list){out+="</"+list+">";list=null;}};
 for(const l of esc(src).split("\n")){
  let m;
  if((m=/^## (.*)/.exec(l))){close();out+="<h3>"+inline(m[1])+"</h3>";}
  else if((m=/^# (.*)/.exec(l))){close();out+="<h2>"+inline(m[1])+"</h2>";}
  else if((m=/^[-*] (.*)/.exec(l))){if(list!=="ul"){close();out+="<ul>";list="ul";}out+="<li>"+inline(m[1])+"</li>";}
  else if((m=/^\d+\. (.*)/.exec(l))){if(list!=="ol"){close();out+="<ol>";list="ol";}out+="<li>"+inline(m[1])+"</li>";}
  else if(!l.trim())close();
  else{close();out+="<p>"+inline(l)+"</p>";}
 }
 close();return out;
}

 }

const MEALS=["Nonushta","Tushlik","Kechki ovqat","Snek"];
const ZERO=()=>({kcal:0,p:0,f:0,c:0});
const foods=()=>DB.list("food"),recipes=()=>DB.list("recipe");
const nz=v=>(typeof v==="number"&&isFinite(v))?v:0;
function foodM(f,g){const k=g/100;return {kcal:nz(f.kcal)*k,p:nz(f.p)*k,f:nz(f.f)*k,c:nz(f.c)*k};}
function recipeTotals(r){const t={kcal:0,p:0,f:0,c:0,g:0};for(const it of r.items||[]){const f=DB.get(it.food);if(!f)continue;const m=foodM(f,it.g);t.kcal+=m.kcal;t.p+=m.p;t.f+=m.f;t.c+=m.c;t.g+=it.g;}return t;}
function recipeM(r,g){const t=recipeTotals(r);if(!t.g)return ZERO();const k=g/t.g;return {kcal:t.kcal*k,p:t.p*k,f:t.f*k,c:t.c*k};}
function mealM(m){
 if(m.manual)return {kcal:nz(m.manual.kcal),p:nz(m.manual.p),f:nz(m.manual.f),c:nz(m.manual.c)};
 if(m.food){const f=DB.get(m.food);return f?foodM(f,m.g):ZERO();}
 if(m.recipe){const r=DB.get(m.recipe);return r?recipeM(r,m.g):ZERO();}
 return ZERO();
}
function mealName(m){if(m.manual)return m.manual.name;const r=DB.get(m.food||m.recipe);return r?r.name:"(o'chirilgan mahsulot)";}
const mealsOn=k=>DB.list("meal").filter(m=>m.date===k);
function dayNut(k){const t=ZERO();for(const m of mealsOn(k)){const x=mealM(m);for(const q in t)t[q]+=x[q];}return t;}
const waterRec=k=>{const r=DB.get("water:"+k);return r&&!r.d?r:null;};
const waterMl=k=>{const r=waterRec(k);return r?(r.log||[]).reduce((a,x)=>a+x.ml,0):0;};
function foodUse(){const u={};for(const m of DB.list("meal")){const id=m.food||m.recipe;if(id)u[id]=(u[id]||0)+1;}return u;}
const NK={kcal:["Kaloriya","kkal"],p:["Oqsil","g"],f:["Yog'","g"],c:["Uglevod","g"]};

const PSTAT=["Rejada","Jarayonda","To'xtatilgan","Tugallangan"];

function projPct(p){
 const ss=stagesOf(p.id),ts=ptasks(p.id),parts=[];
 if(ss.length)parts.push(ss.filter(s=>s.done).length/ss.length);

 return parts.length?Math.round(parts.reduce((a,b)=>a+b,0)/parts.length*100):null;

/* ---------- Analytics: faqat saqlangan yozuvlardan oddiy hisob ---------- */
function barChart(vals,labels,fmt){
 if(!vals.length||vals.every(v=>!v))return '<p class="note">Grafik uchun ma\'lumot yo\'q.</p>';
 const W=320,H=110,P=12,max=Math.max(...vals),bw=(W-2*P)/vals.length;
 let s='<svg class="bars" viewBox="0 0 '+W+" "+H+'" role="img" aria-label="Ustunli grafik">';
 vals.forEach((v,i)=>{const h=max?(v/max)*(H-P-16):0;s+='<rect x="'+(P+i*bw+1).toFixed(1)+'" y="'+(H-P-h).toFixed(1)+'" width="'+Math.max(1,bw-2).toFixed(1)+'" height="'+h.toFixed(1)+'" rx="1.5"/>';});
 return s+'<text x="'+P+'" y="10">'+(fmt||fmtN)(max)+'</text><text x="'+P+'" y="'+(H-1)+'">'+esc(labels[0]||"")+'</text><text x="'+(W-P)+'" y="'+(H-1)+'" text-anchor="end">'+esc(labels[labels.length-1]||"")+"</text></svg>";
}
const datesBack=n=>{const o=[];for(let i=n-1;i>=0;i--)o.push(addDays(today(),-i));return o;};
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const pctTxt=(d,t)=>t?Math.round(d/t*100)+"%":"—";
const stat=(l,v)=>'<div class="stat"><span>'+l+"</span><span>"+v+"</span></div>";
const NOD='<p class="note">Bu davrda ma\'lumot yo\'q.</p>';
function anTasks(ds){
 let tot=0,done=0;for(const k of ds)for(const x of tasksOn(k)){tot++;if(x.done)done++;}
 const over=tasks().filter(t=>!t.done&&t.due&&t.due<today()).length;
 if(!tot&&!over)return NOD;
 return '<div class="stats">'+stat("Muddati shu davrga tushgan vazifalar",tot)+stat("Bajarilgan",done+" ("+pctTxt(done,tot)+")")+stat("Hozir muddati o'tgan ochiq vazifalar",over)+"</div>"+(tot?'<div class="bar sm" style="margin-top:8px"><i style="--w:'+Math.round(done/tot*100)+'%;--c:var(--gold)"></i></div>':"");
}
function anHabits(ds){
 const hs=habs();if(!hs.length)return NOD;
 return '<div class="stats">'+hs.map(h=>{let s=0,d=0;for(const k of ds)if(hSched(h,k)){s++;if((h.logs||{})[k])d++;}return stat(esc(h.name)+(h.paused?" (to'xtatilgan)":""),s?d+"/"+s+" ("+pctTxt(d,s)+"), ketma-ket "+hStreak(h):"jadvalda kun yo'q");}).join("")+"</div>";
}
function anFit(ds){
 const set=new Set(ds),g=gymDays().filter(d=>set.has(d)).length,car=DB.list("cardio").filter(c=>set.has(c.date)),wos=DB.list("wo").filter(w=>set.has(w.date));
 let h='<div class="stats">'+stat("Zalga borgan kunlar",g)+stat("Mashg'ulotlar soni",wos.length)+stat("Umumiy hajm (og'irlik × takror)",money(wos.reduce((a,w)=>a+woVol(w),0))+" kg")+stat("Kardio",fmtN(car.reduce((a,c)=>a+(c.dur||0),0))+" daq, "+fmtN(car.reduce((a,c)=>a+(c.dist||0),0))+" km")+"</div>";
 const rows=[];
 for(const mt of CFG().mt){const es=DB.list("meas").filter(e=>e.type===mt.k).sort(byDate);if(!es.length)continue;const inP=es.filter(e=>set.has(e.date));rows.push('<tr><td>'+esc(mt.l)+"</td><td>"+fmtN(es[es.length-1].value)+"</td><td>"+(es.length>1?sgn(es[es.length-1].value-es[0].value):"—")+"</td><td>"+(inP.length>1?sgn(inP[inP.length-1].value-inP[0].value):"—")+"</td></tr>");}
 if(rows.length)h+='<table class="tbl"><tr><th>O\'lchov</th><th>Joriy</th><th>Birinchidan</th><th>Davrda</th></tr>'+rows.join("")+"</table>";
 const w=DB.list("meas").filter(e=>e.type==="weight").sort(byDate);
 if(w.length>1)h+='<p class="note">Vazn grafigi (barcha qaydlar)</p>'+lineChart(w.map(e=>({x:pk(e.date).getTime(),y:e.value})));
 return h;
}
function anSleep(ds){
 const es=ds.map(k=>({k,e:sleepRec(k)})).filter(x=>x.e);if(!es.length)return NOD;
 const durs=es.map(x=>sleepDur(x.e)),qs=es.map(x=>x.e.q).filter(Boolean),normal=es.filter(x=>sleepStatus(x.e)==="ok").length;
 return '<div class="stats">'+stat("Yozilgan kunlar",es.length)+stat("O'rtacha davomiylik",fmtDur(Math.round(avg(durs))))+stat("Normal oraliqdagi kunlar",normal+" / "+es.length)+stat("O'rtacha o'z bahongiz",qs.length?fmtN(avg(qs))+" / 5":"baho qo'yilmagan")+"</div>"+barChart(ds.slice(-30).map(k=>{const e=sleepRec(k);return e?sleepDur(e)/60:0;}),[fmtD(ds[Math.max(0,ds.length-30)]),fmtD(ds[ds.length-1])],v=>fmtN(v)+" soat");
}
function anMoney(ds){

 if(sv.length)h+='<table class="tbl"><tr><th>Jamg\'arma</th><th>Balans</th><th>Maqsad</th></tr>'+sv.map(s=>{const st=savStat(s.id);return "<tr><td>"+esc(s.name)+"</td><td>"+money(st.bal)+"</td><td>"+(s.target?Math.round(Math.max(0,st.bal)/s.target*100)+"%":"—")+"</td></tr>";}).join("")+"</table>";
 h+='<p class="note">Jamg\'armaga qo\'shilgan summa kunlar bo\'yicha</p>'+barChart(ds.slice(-30).map(k=>txns().filter(x=>x.date===k&&x.kind==="save").reduce((a,x)=>a+x.amount,0)),[fmtD(ds[Math.max(0,ds.length-30)]),fmtD(ds[ds.length-1])],money);
 return h;
}
function anNut(ds){
 const days=ds.filter(k=>mealsOn(k).length);if(!days.length)return NOD;

function anMods(){

/* ---------- Umumiy kalendar ---------- */
function dayDots(k){
 const dots=[];
 if(gymOn(k))dots.push("neon");
 if(projs().some(p=>p.due===k))dots.push("vio");
 if(!needsLock("finance")&&txns().some(x=>x.date===k))dots.push("gold");
 if(sleepRec(k))dots.push("blue");
 if(DB.list("mrec").some(r=>{const m=DB.get(r.mid);return m&&!m.d&&mfields(m).some(f=>f.t==="date"&&r.vals[f.id]===k);}))dots.push("vio");
 return dots;
}

 });

function searchAll(q){
 q=q.trim().toLowerCase();if(!q)return [];const out=[],has=s=>String(s||"").toLowerCase().includes(q);
 tasks().forEach(t=>{if(has(t.title)||has(t.desc)||has(t.note))out.push({l:t.title,s:"Vazifa",a:"tedit",id:t.id});});
 habs().forEach(x=>{if(has(x.name)||has(x.desc))out.push({l:x.name,s:"Odat",sec:"habits"});});
 DB.list("page").forEach(p=>{const n=DB.get(p.nb);if(!n||n.d||n.locked||needsLock("journal"))return;if(has(p.title)||has(p.body)||(p.tags||[]).some(has))out.push({l:p.title||"Nomsiz sahifa",s:"Journal: "+n.name,a:"jopen",id:p.id});});
 if(!needsLock("finance"))txns().forEach(x=>{if(has(x.cat)||has(x.note))out.push({l:(x.cat||KINDS[x.kind])+" "+money(x.amount),s:"Moliya, "+fmtD(x.date),sec:"finance"});});
 DB.list("mrec").forEach(r=>{const m=DB.get(r.mid);if(!m||m.d)return;if(Object.values(r.vals).some(has))out.push({l:recTitle(m,r),s:m.name,a:"mredit",id:r.id,m:m.id,sec:"m:"+m.id});});
 infos().forEach(x=>{if(has(x.title)||has(x.text)||has(x.cat)||(x.tags||[]).some(has))out.push({l:x.title,s:"Ma'lumotlar",sec:"data"});});
 projs().forEach(p=>{if(has(p.name)||has(p.desc))out.push({l:p.name,s:"Loyiha",sec:"project"});});
 DB.list("pitem").forEach(i=>{if(has(i.title)||has(i.text)){const p=DB.get(i.proj);if(p&&!p.d)out.push({l:i.title,s:"Loyiha: "+p.name,sec:"project"});}});
 foods().forEach(f=>{if(has(f.name))out.push({l:f.name,s:"Ozuqa: mahsulot",sec:"nutrition"});});
 DB.list("wo").forEach(w=>{if(has(w.type)||has(w.raw)||has(w.note)||(w.lines||[]).some(l=>has(l.name)))out.push({l:w.type||"Mashg'ulot",s:"Mashg'ulot, "+fmtD(w.date),sec:"fitness"});});
 return out.slice(0,40);
}

async function saveFile(name,text,mime){
 try{
  if(typeof claude!=="undefined"&&claude&&typeof claude.use==="function"){
   const dl=await claude.use("downloads");
   if(dl){try{await dl.save({filename:name,data:text});return true;}catch(e){if(e&&e.code==="declined")return false;}}
  }
 }catch(e){}
 try{const a=document.createElement("a"),u=URL.createObjectURL(new Blob([text],{type:mime}));a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},1500);return true;}
 catch(e){toast("Yuklab olib bo'lmadi. «Matn sifatida ko'rsatish» dan foydalaning");return false;}
}
async function copyText(text){
 try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(text);toast("Nusxalandi");return true;}}catch(e){}
 try{const ta=document.createElement("textarea");ta.value=text;ta.style.cssText="position:fixed;opacity:0";document.body.appendChild(ta);ta.select();const ok=document.execCommand("copy");ta.remove();toast(ok?"Nusxalandi":"Nusxalab bo'lmadi. Matnni qo'lda belgilab nusxalang");return !!ok;}
 catch(e){toast("Nusxalab bo'lmadi. Matnni qo'lda belgilab nusxalang");return false;}
}
async function shareFile(name,text,mime){
 try{const f=new File([text],name,{type:mime});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return true;}}catch(e){if(e&&e.name==="AbortError")return false;}
 toast("Bu qurilmada ulashish yo'q. «Yuklab olish» dan foydalaning");return false;
}

function planImport(data){
 if(!data||data.app!=="niyozos"||!Array.isArray(data.records))throw new Error("Bu NIYOZ OS zaxira fayli emas");
 const res={add:[],upd:[],same:0,types:{},date:data.exported,list:[],cfg:false};
 const fresh=DB.all().filter(x=>x.t!=="cfg").length===0;
 for(const r of data.records){
  if(!r||!r.id||!r.t)continue;const l=DB.get(r.id);
  if(r.id==="cfg"){
   /* o'lchov turlari har doim birlashtiriladi (aks holda ularning qaydlari ko'rinmay qoladi). Boshqa sozlamalar faqat bo'sh ilovaga tiklanadi. PIN va qulf hech qachon almashtirilmaydi. */
   if(l){const m=Object.assign({},l);let ch=false;const have=new Set((l.mt||[]).map(x=>x.k)),add=(r.mt||[]).filter(x=>x&&x.k&&!have.has(x.k));
    if(add.length){m.mt=[...(l.mt||[]),...add];ch=true;}
    if(fresh){for(const k of ["pinned","order","hidden","dash","sleep","nut"])if(r[k]!==undefined){m[k]=r[k];ch=true;}}
    if(ch){res.list.push(m);res.cfg=true;}}
   continue;
  }
  if(!l){res.add.push(r);res.types[r.t]=(res.types[r.t]||0)+1;}
  else if((r.u||0)>(l.u||0)){res.upd.push(l.blob&&r.blobOmitted?Object.assign({},r,{blob:l.blob,blobOmitted:undefined}):r);}else res.same++;
 }
 res.list=[...res.list,...res.add,...res.upd];return res;
}

 }

ACTS.navhide=b=>{const c=CFG(),id=b.dataset.id;if(c.hidden.includes(id))c.hidden=c.hidden.filter(x=>x!==id);else{if(id==="settings"){toast("Sozlamalarni yashirib bo'lmaydi");return;}c.hidden.push(id);c.pinned=c.pinned.filter(x=>x!==id);}DB.put(c);render();};

function pinForm(change){
 if(!hasCrypto()){toast("Bu brauzerda PIN ishlamaydi");return;}
 openForm({title:change?"PIN o'zgartirish":"PIN o'rnatish",fields:[...(change?[{k:"old",l:"Joriy PIN",t:"password"}]:[]),{k:"p1",l:"Yangi PIN (4-6 raqam)",t:"password",req:1},{k:"p2",l:"PIN ni takrorlang",t:"password",req:1}],
  onSubmit:v=>{
   if(!/^\d{4,6}$/.test(v.p1))return "PIN 4 dan 6 gacha raqamdan iborat bo'lsin";if(v.p1!==v.p2)return "PIN lar bir xil emas";
   (async()=>{if(change&&!(await checkPin(v.old))){toast("Joriy PIN noto'g'ri");return;}await setPin(v.p1);render();toast("PIN saqlandi");})();
  }});
}
ACTS.pinset=()=>pinForm(false);ACTS.pinchg=()=>pinForm(true);
ACTS.pinoff=()=>openForm({title:"PIN ni o'chirish",fields:[{k:"old",l:"Joriy PIN",t:"password",req:1}],submit:"O'chirish",onSubmit:v=>{(async()=>{if(!(await checkPin(v.old))){toast("PIN noto'g'ri");return;}const c=CFG();c.pin=null;c.lock={app:0,finance:0,journal:0};DB.put(c);render();toast("PIN o'chirildi");})();}});
ACTS.locktg=b=>{const c=CFG(),k=b.dataset.k;c.lock[k]=c.lock[k]?0:1;DB.put(c);render();};

 });
 addEventListener("pagehide",()=>{if(typeof jflush==="function")jflush();});
 try{if("serviceWorker" in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{});}catch(e){}
